# Heartbeat dla projektów Supabase na planie Free: bez ruchu przez 7 dni projekt jest pauzowany.
# Dwa razy w tygodniu jedno zapytanie SELECT do tabeli public.heartbeat (anon ma tylko SELECT na tej tabeli).
name: Supabase heartbeat
on:
  schedule:
    - cron: "17 6 * * 1,4"   # poniedziałek i czwartek, 06:17 UTC
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [ISKRA, WEEKLEAF]
    steps:
      - name: Ping ${{ matrix.project }}
        env:
          URL: ${{ secrets[format('SB_{0}_URL', matrix.project)] }}
          KEY: ${{ secrets[format('SB_{0}_KEY', matrix.project)] }}
        run: |
          out=$(curl -sS --fail --max-time 30 "$URL/rest/v1/heartbeat?select=id,touched_at&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "$out"
          echo "$out" | grep -q touched_at
