<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Pendulum — web prototype</title>
<meta name="description" content="Pendulum: Rope Swing — early browser prototype of the one-touch rope swing game. The iPhone version has 100 levels, ten worlds and a daily challenge.">
<meta name="theme-color" content="#07131B">
<meta property="og:title" content="Pendulum — web prototype — Firewisp Studio">
<meta property="og:description" content="Early browser prototype of the rope-swing game. Hold to grab, release to fly.">
<link rel="icon" href="../../assets/icon-pendulum.webp" type="image/webp">
<style>
@font-face { font-family: "Fraunces"; src: url("../../assets/fonts/fraunces-latin-ext.woff2") format("woff2"); font-weight: 300 900; font-display: swap; unicode-range: U+0100-02BA, U+1E00-1EFF; }
@font-face { font-family: "Fraunces"; src: url("../../assets/fonts/fraunces-latin.woff2") format("woff2"); font-weight: 300 900; font-display: swap; unicode-range: U+0000-00FF, U+2000-206F; }
@font-face { font-family: "Manrope"; src: url("../../assets/fonts/manrope-latin-ext.woff2") format("woff2"); font-weight: 200 800; font-display: swap; unicode-range: U+0100-02BA, U+1E00-1EFF; }
@font-face { font-family: "Manrope"; src: url("../../assets/fonts/manrope-latin.woff2") format("woff2"); font-weight: 200 800; font-display: swap; unicode-range: U+0000-00FF, U+2000-206F; }
:root { --bar: 48px; --cream: #F5F1E9; --muted: #AABCC5; }
html, body { margin: 0; height: 100%; background: #07131B; overflow: hidden; }
body { display: flex; flex-direction: column; font-family: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif; }
#game { flex: 1 1 auto; min-height: 0; position: relative; }
#game iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #07131B; }
#fw-bar { flex: none; height: var(--bar); display: flex; align-items: center; gap: 10px; padding: 0 10px 0 6px; background: rgba(7,19,27,.92); border-bottom: 1px solid rgba(40,66,75,.7); color: var(--cream); transition: height .25s ease, opacity .25s ease; overflow: hidden; }
#fw-bar a, #fw-bar button { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; border-radius: 999px; border: 0; background: none; color: var(--muted); font: inherit; font-size: 14px; font-weight: 600; text-decoration: none; cursor: pointer; white-space: nowrap; }
#fw-bar a:hover, #fw-bar button:hover { color: var(--cream); background: rgba(255,255,255,.06); }
#fw-bar .brand svg { width: 18px; height: 25px; } #fw-bar .brand b { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 16px; color: var(--cream); }
#fw-bar .title { flex: 1; text-align: center; font-family: "Fraunces", Georgia, serif; font-size: 16px; color: var(--cream); overflow: hidden; text-overflow: ellipsis; }
#fw-bar .title .proto { display: inline-block; margin-left: 8px; padding: 2px 9px; border-radius: 999px; font-family: "Manrope", sans-serif; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #FFAD65; border: 1px solid rgba(255,173,101,.45); vertical-align: middle; }
#fw-bar .ico { width: 18px; height: 18px; } #fw-bar .fs { display: none; } .has-fs #fw-bar .fs { display: inline-flex; }
body.bar-hidden #fw-bar { height: 0; opacity: 0; pointer-events: none; }
#fw-tab { position: fixed; left: 8px; bottom: 8px; z-index: 9; width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(255,255,255,.18); background: rgba(7,19,27,.6); color: var(--cream); display: none; align-items: center; justify-content: center; cursor: pointer; opacity: .55; }
#fw-tab:hover { opacity: 1; } #fw-tab svg { width: 18px; height: 18px; } body.bar-hidden #fw-tab { display: inline-flex; }
@media (max-width: 520px) { #fw-bar .title span.t { display: none; } }
[data-l]:not([data-l-active]), #fw-bar [data-l]:not([data-l-active]) { display: none !important; }
</style>
</head>
<body>
<div id="fw-bar">
  <a class="brand" href="../../" title="Firewisp Studio"><svg viewBox="0 0 100 140" aria-hidden="true"><defs><linearGradient id="fg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#FFC25A"/><stop offset=".45" stop-color="#FF9A3E"/><stop offset="1" stop-color="#FF5A3C"/></linearGradient></defs><path fill="url(#fg)" d="M50 0C68 25 100 48 100 92c0 27-22 48-50 48S0 119 0 92C0 48 32 25 50 0z"/><circle cx="35" cy="86" r="11" fill="#fff"/><circle cx="65" cy="86" r="11" fill="#fff"/><circle cx="37" cy="88" r="5.5" fill="#2A1A12"/><circle cx="67" cy="88" r="5.5" fill="#2A1A12"/><path d="M38 106q12 10 24 0" stroke="#2A1A12" stroke-width="4" fill="none" stroke-linecap="round"/></svg><b>Firewisp</b><span data-l="en">← back</span><span data-l="pl">← wróć</span></a>
  <span class="title"><span class="t">Pendulum</span><span class="proto" data-l="en">web prototype</span><span class="proto" data-l="pl">prototyp web</span></span>
  <button class="fs" type="button" id="fw-fs"><svg class="ico" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 8V3h5M12 3h5v5M17 12v5h-5M8 17H3v-5"/></svg><span data-l="en">Full screen</span><span data-l="pl">Pełny ekran</span></button>
  <button type="button" id="fw-hide" aria-label="Hide bar"><svg class="ico" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5-5 5 5"/></svg></button>
</div>
<button id="fw-tab" type="button" aria-label="Show bar"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l-6 6 6 6"/></svg></button>
<div id="game"><iframe src="proto.html" title="Pendulum prototype" allow="fullscreen"></iframe></div>
<script>
(function () {
  var pl = (navigator.language || '').toLowerCase().indexOf('pl') === 0;
  try { var s = localStorage.getItem('fw-lang'); if (s) pl = (s === 'pl'); } catch (e) {}
  document.querySelectorAll('[data-l]').forEach(function (el) { el.toggleAttribute('data-l-active', el.dataset.l === (pl ? 'pl' : 'en')); });
  var pref = null; try { pref = localStorage.getItem('fw-bar'); } catch (e) {}
  var hidden = pref ? pref === 'hidden' : (window.innerHeight < 500);
  var setBar = function (h) { document.body.classList.toggle('bar-hidden', h); try { localStorage.setItem('fw-bar', h ? 'hidden' : 'shown'); } catch (e) {} };
  document.body.classList.toggle('bar-hidden', hidden);
  document.getElementById('fw-hide').addEventListener('click', function () { setBar(true); });
  document.getElementById('fw-tab').addEventListener('click', function () { setBar(false); });
  if (document.documentElement.requestFullscreen) { document.documentElement.classList.add('has-fs'); document.getElementById('fw-fs').addEventListener('click', function () { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(function () {}); }); }
})();
</script>
</body>
</html>
