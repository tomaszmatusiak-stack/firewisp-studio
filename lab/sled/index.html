<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Sled Lines</title>
<style>
html,body{margin:0;height:100%;background:#0b1020;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:system-ui,-apple-system,sans-serif}
body{height:100dvh}
canvas{display:block;position:absolute;left:0;top:0;touch-action:none}
</style>
<script data-goatcounter="https://firewisp.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body><canvas id="c"></canvas>
<script>
'use strict';
// ===== Sled Lines — Firewisp Studio prototype =====
const W=1080,H=1920,WW=3240,WH=1920,STEP=1/120,GRAV=2200,SR=16,SAMPLE=12;
const COL={skyT:'#FFD9A0',skyB:'#9FB8E8',mtn:'#B8C8E6',mtn2:'#A9BCDE',shade:'#CFE0F5',pine:'#2F5D4A',glow:'#4DA3FF',go:'#3CB043',hat:'#D8332A',navy:'#16233A',gold:'#FFD23F'};
const FONT='system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let scale=1,offX=0,offY=0,dpr=1;
// one state object
const S={screen:'title',level:1,mode:'draw',tool:'draw',strokes:[],cur:null,inkUsed:0,cam:{x:0,y:0},lvl:null,sled:null,ride:null,ghost:null,parts:[],flakes:[],result:null,toast:null,muted:false,prog:null,shared:null,pointers:new Map(),anim:0,btns:[],pressed:null,pressT:0};
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const polyLen=p=>{let l=0;for(let i=1;i<p.length;i++)l+=Math.hypot(p[i].x-p[i-1].x,p[i].y-p[i-1].y);return l};

// ===== RNG + noise =====
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function makeNoise(rnd,n){const v=[];for(let i=0;i<n;i++)v.push(rnd());return x=>{const i=Math.floor(x),f=x-i,a=v[((i%n)+n)%n],b=v[(((i+1)%n)+n)%n],u=f*f*(3-2*f);return a+(b-a)*u}}
function profileAt(cps,x){if(x<=cps[0][0])return cps[0][1];for(let i=1;i<cps.length;i++)if(x<=cps[i][0]){const p=cps[i-1],q=cps[i],u=(1-Math.cos((x-p[0])/(q[0]-p[0])*Math.PI))/2;return p[1]+(q[1]-p[1])*u}return cps[cps.length-1][1]}

// ===== Level generator (seeded by level number) =====
function genLevel(n){for(let att=0;att<6;att++){const L=buildLevel(n,mulberry32(n*7919+att*104729+17));if(L.dist<=L.ink*0.8)return L}return buildLevel(n,mulberry32(n))}
function buildLevel(n,rnd){
  const noise=makeNoise(rnd,64),amp=50+Math.min(60,n*6);
  const cps=[[-300,610],[0,610],[420,740],[1000,1180+rnd()*120],[1500,1120-rnd()*(60+n*14)],[2000,1220+rnd()*130],[2500,1130-rnd()*(50+n*12)],[2800,1040+rnd()*100],[3600,990]];
  const gy=x=>{const m=clamp((x-620)/260,0,1)*clamp((2900-x)/200,0,1);return profileAt(cps,x)+(noise(x/260)-0.5)*2*amp*m};
  const L={n,gy,gap:null,ground:[],stars:[],obs:[],mtn:[]};
  if(n>=3){const x0=1250+rnd()*650,w=230+Math.min(220,n*18)+rnd()*90;L.gap={x0,x1:x0+w,bed:Math.min(WH-140,Math.max(gy(x0),gy(x0+w))+460)}}
  for(let x=-240;x<=WW+240;x+=36){if(L.gap&&x>L.gap.x0&&x<L.gap.x1)continue;L.ground.push({x,y:gy(x)})}
  if(L.gap){const g=L.gap,i=L.ground.findIndex(p=>p.x>g.x1);L.ground.splice(i,0,{x:g.x0,y:gy(g.x0)},{x:g.x0,y:g.bed},{x:g.x1,y:g.bed},{x:g.x1,y:gy(g.x1)})}
  L.start={x:150,y:gy(150)-SR};L.finish={x:WW-220,y:gy(WW-220)};
  L.dist=Math.hypot(L.finish.x-L.start.x,L.finish.y-L.start.y);
  L.ink=Math.round(L.dist*Math.max(1.3,2.0-0.08*n));
  for(let i=0;i<3;i++){const f=0.26+i*0.24+(rnd()-0.5)*0.08,x=L.start.x+(L.finish.x-L.start.x)*f;let base=gy(x);if(L.gap&&x>L.gap.x0-80&&x<L.gap.x1+80)base=Math.min(gy(L.gap.x0),gy(L.gap.x1));L.stars.push({x,y:Math.max(200,base-(170+rnd()*260+n*10))})}
  const cnt=n<4?1:2;
  for(let k=0;k<cnt;k++)for(let tr=0;tr<12;tr++){const x=900+rnd()*1750;if(L.gap&&x>L.gap.x0-220&&x<L.gap.x1+220)continue;if(L.obs.some(o=>Math.abs(o.x-x)<260)||L.stars.some(s=>Math.abs(s.x-x)<140))continue;const y=gy(x);L.obs.push(rnd()<0.6?{t:'tree',x,y,c:[[x,y-52,46],[x,y-128,38]]}:{t:'rock',x,y,c:[[x,y-26,42+rnd()*14]]});break}
  for(let l=0;l<2;l++){const pts=[],nz=makeNoise(rnd,32),span=WW*(l?0.45:0.22)+W+200;for(let x=-100;x<=span;x+=60)pts.push({x,y:(l?1000:830)+(nz(x/(l?240:380))-0.5)*(l?380:260)});L.mtn.push(pts)}
  return L;
}

// ===== Share link (level + strokes -> base64url) =====
function encodeTrack(lvl,strokes){const b=[];const vi=n=>{while(n>=128){b.push((n&127)|128);n>>>=7}b.push(n)};const zz=n=>vi(n<0?-n*2-1:n*2);
  b.push(1);vi(lvl);vi(strokes.length);
  for(const s of strokes){vi(s.pts.length);let lx=0,ly=0;for(const p of s.pts){const x=Math.round(p.x),y=Math.round(p.y);zz(x-lx);zz(y-ly);lx=x;ly=y}}
  let str='';for(const v of b)str+=String.fromCharCode(v);return btoa(str).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function decodeTrack(str){try{const bin=atob(str.replace(/-/g,'+').replace(/_/g,'/'));let i=0;const rv=()=>{let n=0,sh=0,c;do{c=bin.charCodeAt(i++);if(isNaN(c))throw 0;n|=(c&127)<<sh;sh+=7}while(c&128);return n>>>0};const rz=()=>{const n=rv();return n&1?-(n+1)/2:n/2};
  if(rv()!==1)return null;const lvl=rv(),ns=rv();if(lvl<1||lvl>9999||ns>200)return null;const strokes=[];
  for(let k=0;k<ns;k++){const n=rv();if(n>5000)return null;const pts=[];let x=0,y=0;for(let j=0;j<n;j++){x+=rz();y+=rz();pts.push({x,y})}if(pts.length>=2)strokes.push({pts,len:polyLen(pts)})}return{lvl,strokes}}catch(e){return null}}
function parseHash(){const m=/[#&]t=([A-Za-z0-9_-]+)/.exec(location.hash||'');return m?decodeTrack(m[1]):null}
function share(){const code=encodeTrack(S.level,S.strokes);const url=location.href.split('#')[0]+'#t='+code;history.replaceState(null,'',url);
  const ok=()=>toast('Link copied');const no=()=>toast('Link is in the address bar');
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(url).then(ok,no);else no()}

// ===== Progress =====
function load(){try{const p=JSON.parse(localStorage.getItem('fw_sled'));if(p&&typeof p==='object')return Object.assign({unlocked:1,last:1,best:{},muted:false},p)}catch(e){}return{unlocked:1,last:1,best:{},muted:false}}
function save(){S.prog.muted=S.muted;S.prog.last=S.level;try{localStorage.setItem('fw_sled',JSON.stringify(S.prog))}catch(e){}}

// ===== Audio (WebAudio, synthesized) =====
let AC=null;
function unlockAudio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function tone(f,dur,type,vol,slide){if(!AC||S.muted)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur)}
function hiss(dur,vol,fc){if(!AC||S.muted)return;const t=AC.currentTime,n=Math.floor(AC.sampleRate*dur),buf=AC.createBuffer(1,n,AC.sampleRate),d=buf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;const src=AC.createBufferSource(),bp=AC.createBiquadFilter(),g=AC.createGain();src.buffer=buf;bp.type='bandpass';bp.frequency.value=fc;bp.Q.value=0.8;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);src.connect(bp).connect(g).connect(AC.destination);src.start(t)}
const SFX={click:()=>tone(620,0.07,'square',0.06),draw:()=>hiss(0.05,0.05,2400),star:()=>{tone(880,0.12,'sine',0.18);setTimeout(()=>tone(1320,0.22,'sine',0.18),70)},
  win:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,0.28,'triangle',0.18),i*110)),fail:()=>{tone(260,0.5,'sawtooth',0.12,-200);hiss(0.3,0.25,600)},
  land:()=>hiss(0.1,0.18,500),go:()=>tone(440,0.18,'triangle',0.14,320),splash:()=>hiss(0.5,0.3,900)};

// ===== Level / ride control =====
function loadLevel(n,strokes){S.level=n;S.lvl=genLevel(n);S.strokes=strokes||[];recalcInk();S.ghost=null;S.cam.x=0;S.cam.y=0;S.mode='draw';S.ride=null;S.sled=null;S.result=null;S.cur=null;S.parts=[]}
function recalcInk(){S.inkUsed=S.strokes.reduce((a,s)=>a+s.len,0)}
function clampCam(){S.cam.x=clamp(S.cam.x,0,WW-W);S.cam.y=clamp(S.cam.y,-420,WH-H)}
function buildSegs(){const segs=[];const add=(a,b,flip,capA,capB)=>{const dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy);if(l<0.5)return;let nx=dy/l,ny=-dx/l;if(flip&&ny>0){nx=-nx;ny=-ny}segs.push({ax:a.x,ay:a.y,dx,dy,l2:l*l,nx,ny,tx:dx/l,ty:dy/l,capA,capB})};
  const g=S.lvl.ground;for(let i=1;i<g.length;i++)add(g[i-1],g[i],false,false,false);
  for(const s of S.strokes){const p=s.pts,n=p.length;for(let i=1;i<n;i++)add(p[i-1],p[i],true,i===1,i===n-1)}return segs}
function startRide(){if(S.cur)endStroke();const st=S.lvl.start;S.sled={x:st.x,y:st.y,vx:120,vy:0,ang:0,dir:1,grounded:true};
  S.ride={t:0,segs:buildSegs(),path:[],over:null,overT:0,stars:[false,false,false],stuck:0,n:0,maxX:st.x,noProg:0};S.mode='ride';S.result=null;S.shared=null;SFX.go()}
function stopRide(){if(S.ride&&S.ride.path.length>1)S.ghost=S.ride.path;S.ride=null;S.sled=null;S.mode='draw';S.result=null;S.screen='play';clampCam()}
function endRide(reason){const R=S.ride,L=S.lvl,sl=S.sled;if(R.over)return;R.over=reason;R.overT=0;const stars=R.stars.filter(Boolean).length;
  S.result={reason,stars,time:R.t,inkLeft:Math.max(0,L.ink-S.inkUsed)};
  if(reason==='finish'){SFX.win();burst(sl.x,sl.y,'255,255,255');const P=S.prog;P.unlocked=Math.max(P.unlocked,S.level+1);P.best[S.level]=Math.max(P.best[S.level]||0,stars);save()}
  else{reason==='fell'?SFX.splash():SFX.fail();burst(sl.x,sl.y,'255,255,255');if(reason==='crash')burst(sl.x,sl.y,'216,51,42')}}
// one-sided contact between the sled (prev px,py -> x,y) and a segment
// returns contact point + push normal; interior vertices have no end-cap, free stroke ends get a radial cap
function contact(s,px,py,x,y,grounded){const sPrev=(px-s.ax)*s.nx+(py-s.ay)*s.ny,sCur=(x-s.ax)*s.nx+(y-s.ay)*s.ny;
  if(sPrev<-SR*0.6)return null;const pad=grounded?SR+5:SR;if(sCur>pad)return null;
  if(sPrev>=0&&sCur<0){const k=sPrev/(sPrev-sCur),qx=px+(x-px)*k,qy=py+(y-py)*k,t=((qx-s.ax)*s.dx+(qy-s.ay)*s.dy)/s.l2;if(t>=0&&t<=1)return{x:s.ax+s.dx*t,y:s.ay+s.dy*t,nx:s.nx,ny:s.ny}}
  let t=((x-s.ax)*s.dx+(y-s.ay)*s.dy)/s.l2,cap=false;
  if(t<0){if(!s.capA)return null;t=0;cap=true}else if(t>1){if(!s.capB)return null;t=1;cap=true}
  const cx=s.ax+s.dx*t,cy=s.ay+s.dy*t,d=Math.hypot(x-cx,y-cy);if(d>=pad)return null;
  if(cap&&d>0.01){const ny=(y-cy)/d;if(ny>-0.3)return null;return{x:cx,y:cy,nx:(x-cx)/d,ny}}
  return{x:cx,y:cy,nx:s.nx,ny:s.ny}}
function stepRide(dt){const sl=S.sled,R=S.ride,L=S.lvl;R.t+=dt;const px=sl.x,py=sl.y;
  sl.vy+=GRAV*dt;const ad=1-0.012*dt;sl.vx*=ad;sl.vy*=ad;sl.x+=sl.vx*dt;sl.y+=sl.vy*dt;
  let grounded=false,gang=sl.ang;
  for(let it=0;it<2;it++)for(const s of R.segs){const c=contact(s,px,py,sl.x,sl.y,sl.grounded);if(!c)continue;
    const vn=sl.vx*c.nx+sl.vy*c.ny;
    if(vn<0){const vt=sl.vx*c.ny-sl.vy*c.nx,sp=Math.hypot(sl.vx,sl.vy);
      if(sp>380&&Math.atan2(-vn,Math.abs(vt))>70*Math.PI/180){endRide('crash');return}
      if(-vn>260){SFX.land();spray(sl.x,sl.y,10)}
      sl.vx-=c.nx*vn;sl.vy-=c.ny*vn}
    sl.x=c.x+c.nx*SR;sl.y=c.y+c.ny*SR;const f=1-0.14*dt;sl.vx*=f;sl.vy*=f;grounded=true;
    const fwd=(sl.vx*s.tx+sl.vy*s.ty)>=0;gang=Math.atan2(fwd?s.ty:-s.ty,fwd?s.tx:-s.tx)}
  sl.grounded=grounded;const sp=Math.hypot(sl.vx,sl.vy);
  if(sl.vx<-60)sl.dir=-1;else if(sl.vx>60)sl.dir=1;
  let target=grounded?gang:(sp>80?Math.atan2(sl.vy,sl.vx):sl.ang);if(sl.dir<0&&(grounded||sp>80))target+=Math.PI;
  let d=target-sl.ang;d=Math.atan2(Math.sin(d),Math.cos(d));sl.ang+=d*Math.min(1,10*dt);
  if(grounded&&sp>250&&Math.random()<0.5)spray(sl.x,sl.y+SR*0.6,1);
  L.stars.forEach((st,i)=>{if(!R.stars[i]&&Math.hypot(st.x-sl.x,st.y-sl.y)<34+SR+8){R.stars[i]=true;burst(st.x,st.y,'255,210,60');SFX.star()}});
  for(const o of L.obs)for(const c of o.c)if(Math.hypot(c[0]-sl.x,c[1]-sl.y)<c[2]+SR){endRide('crash');return}
  if(px<L.finish.x&&sl.x>=L.finish.x&&sl.y>L.finish.y-400&&sl.y<L.finish.y+40){endRide('finish');return}
  if(sl.y>WH+80||sl.x<-160||sl.x>WW+160){endRide('fell');return}
  if(L.gap&&sl.x>L.gap.x0&&sl.x<L.gap.x1&&sl.y>L.gap.bed-50){endRide('fell');return}
  R.stuck=sp<25?R.stuck+dt:0;if(sl.x>R.maxX+1){R.maxX=sl.x;R.noProg=0}else R.noProg+=dt;if(R.stuck>1.2||R.noProg>3){endRide('stuck');return}
  if(R.n++%3===0)R.path.push({x:sl.x,y:sl.y})}

// ===== Particles =====
function spray(x,y,n){const v=S.sled;for(let i=0;i<n;i++)S.parts.push({x,y,vx:(Math.random()-0.5)*300-v.vx*0.25,vy:-Math.random()*320-80,life:0.6+Math.random()*0.3,max:0.9,r:3+Math.random()*4,col:'255,255,255'});if(S.parts.length>400)S.parts.splice(0,S.parts.length-400)}
function burst(x,y,col){for(let i=0;i<16;i++){const a=Math.random()*7,s=180+Math.random()*320;S.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-100,life:0.8,max:0.8,r:4+Math.random()*4,col})}}
function toast(t){S.toast={text:t,t:2.6}}

// ===== Strokes =====
function beginStroke(x,y){S.cur={pts:[{x,y}],len:0,sx:x,sy:y}}
function addStrokePoint(x,y){const c=S.cur;if(!c)return;c.sx+=(x-c.sx)*0.5;c.sy+=(y-c.sy)*0.5;const l=c.pts[c.pts.length-1],d=Math.hypot(c.sx-l.x,c.sy-l.y);if(d<SAMPLE)return;
  const rem=S.lvl.ink-S.inkUsed-c.len;if(rem<=0.5){endStroke();toast('Out of ink');return}
  const k=Math.min(1,rem/d);c.pts.push({x:clamp(l.x+(c.sx-l.x)*k,-200,WW+200),y:clamp(l.y+(c.sy-l.y)*k,-600,WH)});c.len+=d*k;
  if(c.pts.length%4===0)SFX.draw();if(k<1){endStroke();toast('Out of ink')}}
function endStroke(){const c=S.cur;S.cur=null;if(!c||c.pts.length<2)return;const p=c.pts;
  if(p.length>2){const q=[p[0]];for(let i=1;i<p.length-1;i++)q.push({x:(p[i-1].x+2*p[i].x+p[i+1].x)/4,y:(p[i-1].y+2*p[i].y+p[i+1].y)/4});q.push(p[p.length-1]);c.pts=q}
  S.strokes.push({pts:c.pts,len:polyLen(c.pts)});recalcInk()}

// ===== Input (Pointer Events) =====
function toL(e){return{x:(e.clientX-offX)/scale,y:(e.clientY-offY)/scale}}
function hitBtn(p){for(const b of S.btns){if(b.r?Math.hypot(p.x-b.x,p.y-b.y)<=b.r+8:(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h))return b.id}return null}
function activePointers(){return[...S.pointers.values()].filter(q=>!q.ui)}
function onDown(e){e.preventDefault();unlockAudio();const p=toL(e),b=hitBtn(p);
  if(b){S.pointers.set(e.pointerId,{ui:true});press(b);return}
  if(S.screen==='title'){S.pointers.set(e.pointerId,{ui:true});startGame();return}
  if(S.screen!=='play'||S.mode!=='draw'){S.pointers.set(e.pointerId,{ui:true});return}
  const act=activePointers(),wantPan=S.tool==='pan'||e.button===2||e.shiftKey||act.length>=1;
  S.pointers.set(e.pointerId,{ui:false,x:p.x,y:p.y,pan:wantPan});
  if(act.length>=1){if(S.cur)S.cur=null;for(const a of act)a.pan=true}else if(!wantPan)beginStroke(p.x+S.cam.x,p.y+S.cam.y)}
function onMove(e){const q=S.pointers.get(e.pointerId);if(!q||q.ui)return;const p=toL(e),dx=p.x-q.x,dy=p.y-q.y;q.x=p.x;q.y=p.y;
  if(q.pan){const n=activePointers().length||1;S.cam.x-=dx/n;S.cam.y-=dy/n;clampCam()}else if(S.cur)addStrokePoint(p.x+S.cam.x,p.y+S.cam.y)}
function onUp(e){const q=S.pointers.get(e.pointerId);S.pointers.delete(e.pointerId);if(q&&!q.ui&&!q.pan&&S.cur)endStroke()}
cv.addEventListener('pointerdown',onDown);window.addEventListener('pointermove',onMove);window.addEventListener('pointerup',onUp);window.addEventListener('pointercancel',onUp);
window.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('keydown',e=>{if(S.screen!=='play')return;if(e.key===' '){e.preventDefault();press(S.mode==='ride'?'reset':'go')}else if(e.key==='z'&&S.mode==='draw')press('undo')});
function press(id){SFX.click();S.pressed=id;S.pressT=0.15;const P=S.prog;
  switch(id){
    case'go':startRide();break;case'reset':stopRide();break;
    case'undo':if(S.cur)S.cur=null;else if(S.strokes.length){S.strokes.pop();recalcInk()}break;
    case'clear':S.cur=null;S.strokes=[];recalcInk();break;
    case'tool':S.tool=S.tool==='draw'?'pan':'draw';break;
    case'mute':S.muted=!S.muted;save();break;
    case'retry':stopRide();break;
    case'next':loadLevel(S.level+1,[]);S.screen='play';S.shared=null;history.replaceState(null,'',location.pathname);save();break;
    case'share':share();break;
    case'menu':stopRide();S.screen='title';break;
    case'lvl-':case'lvl+':{const n=clamp(S.level+(id==='lvl+'?1:-1),1,P.unlocked);if(n!==S.level){loadLevel(n,[]);S.shared=null;history.replaceState(null,'',location.pathname);save()}break}
    case'play':startGame()}}

  S.btns.push({id:'lvl-',x:200,y:870,w:100,h:100},{id:'lvl+',x:780,y:870,w:100,h:100});ctx.fillStyle=S.level>1?'#fff':'rgba(255,255,255,0.3)';ctx.beginPath();ctx.moveTo(300,890);ctx.lineTo(300,950);ctx.lineTo(240,920);ctx.closePath();ctx.fill();
